[package]
name = "rsx"
version = "0.1.0"
edition = "2021"
publish = false
description = "JSX-like <tag attr={expr}>{child}</tag> macro that expands to builder-chain calls (tag().attr(expr).child(child)). Not gpui-specific — works with any builder-pattern element."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
