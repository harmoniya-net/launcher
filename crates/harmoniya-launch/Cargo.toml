[package]
name = "harmoniya-launch"
version = "0.1.0"
edition = "2021"
publish = false
description = "Game install/launch pipeline (opys_runtime) and game process lifecycle."

[dependencies]
harmoniya-api = { path = "../harmoniya-api" }
opys-runtime = { workspace = true }
opys-bundle = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
indexmap = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# A test bundle is written with the same crates `opys build` writes one with.
opys-core = "0.9.0"
tempfile = "3"
