# Release pipeline. Cut a release by pushing a tag, e.g.:
#     git tag v0.5.14 && git push origin v0.5.14
# Builds Linux, Windows, and both macOS (arm64 + x86_64) targets natively —
# GitHub-hosted runners give us real Windows and macOS hardware for free on a
# public repo, so unlike the old GitLab pipeline nothing here is cross-compiled.
# macOS ships as a real .app bundle (icon + Info.plist), not a bare binary.
# Assets get fixed (non-versioned) names, so GitHub's built-in
#     https://github.com/harmoniya-net/launcher/releases/latest/download/<asset>
# permalinks always resolve to the newest release without any extra CI work.
# The self-updater (src/shell/update.rs) matches assets by target-triple
# substring, so the archive names below must keep the triple in them.
#
# `workflow_dispatch` lets you build every target on demand (Actions tab →
# "Run workflow") to sanity-check the pipeline without cutting a real tag;
# the publish step only runs for an actual tag push.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: harmoniya-launcher-x86_64-unknown-linux-gnu.tar.gz
            raw: harmoniya-launcher-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: harmoniya-launcher-x86_64-pc-windows-msvc.tar.gz
            raw: harmoniya-launcher-windows.exe
          # macOS ships as a proper .app bundle (icon + Info.plist), not a
          # bare binary, so there's no `raw` direct-download link for it —
          # /macos and /macos-intel (launcher.harmoniya.net) point straight
          # at these .tar.gz archives instead.
          - os: macos-14
            target: aarch64-apple-darwin
            archive: harmoniya-launcher-aarch64-apple-darwin.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: harmoniya-launcher-x86_64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # System libraries GPUI links on Linux (xcb + xkbcommon).
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang curl \
            libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxau-dev libxdmcp-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Archive (self-updater's download source, name carries the triple) +
      # raw binary (stable direct-download link, name deliberately has no
      # triple so it never gets matched by the self-updater).
      - name: Package (Linux/Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -eux
          mkdir -p dist stage
          bin="harmoniya-launcher"
          [ "${{ runner.os }}" = "Windows" ] && bin="harmoniya-launcher.exe"
          src="target/${{ matrix.target }}/release/$bin"
          cp "$src" "stage/$bin"
          tar -C stage -czf "dist/${{ matrix.archive }}" "$bin"
          cp "$src" "dist/${{ matrix.raw }}"

      # macOS: a real .app bundle (icon + Info.plist), built with the stock
      # macOS tools `sips`/`iconutil` (no extra deps needed on the runner).
      # The self-updater is told where the binary sits inside it via
      # bin_path_in_archive (src/shell/update.rs) — it doesn't need the
      # bundle at the archive root, just an exact path to the executable.
      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux
          mkdir -p dist stage
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="stage/Harmoniya.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/harmoniya-launcher" "$app/Contents/MacOS/harmoniya-launcher"
          chmod +x "$app/Contents/MacOS/harmoniya-launcher"

          iconset="$(mktemp -d)/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
          sips -z $size $size assets/logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          double=$((size * 2))
          sips -z $double $double assets/logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleExecutable</key><string>harmoniya-launcher</string>
          <key>CFBundleIdentifier</key><string>net.harmoniya.launcher</string>
          <key>CFBundleName</key><string>Harmoniya</string>
          <key>CFBundleDisplayName</key><string>Harmoniya</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>$version</string>
          <key>CFBundleVersion</key><string>$version</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          tar -C stage -czf "dist/${{ matrix.archive }}" "Harmoniya.app"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
