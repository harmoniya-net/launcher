# CI/CD for the Harmoniya launcher (GPUI / Rust).
#
# Cut a release by pushing a tag, e.g.:
#     git tag v0.3.1 && git push origin v0.3.1
# That builds Linux + Windows binaries and publishes them to GitLab Releases.
# The launcher self-updater (src/shell/update.rs, GitLab backend) downloads
# the asset whose name contains the running target triple — so the .tar.gz asset
# NAMES below must stay stable, and the tag must match `version` in Cargo.toml
# (self_update compares them as semver, ignoring a leading `v`).
#
# Linux builds on the default Linux shared runners. Windows MUST build on a
# native Windows runner: gpui's build.rs compiles HLSL shaders with fxc.exe and
# is gated on the *host* being Windows, so it can't be cross-compiled from Linux.
# build:windows targets GitLab's SaaS Windows runners (tag
# `saas-windows-medium-amd64`); enable those on the project, or register a
# self-hosted Windows runner carrying that tag.

stages: [check, build, release]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: "always"
  # Generic Package Registry base the release asset links point at.
  PKG_BASE: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/launcher/${CI_COMMIT_TAG}"
  LINUX_ASSET: "harmoniya-launcher-x86_64-unknown-linux-gnu.tar.gz"
  WINDOWS_ASSET: "harmoniya-launcher-x86_64-pc-windows-msvc.tar.gz"
  # Raw (un-archived) binaries for direct download. Names deliberately omit the
  # target triple so the self-updater (which matches assets containing the
  # triple) only ever picks the .tar.gz archives, never these.
  LINUX_BIN: "harmoniya-launcher-linux"
  WINDOWS_BIN: "harmoniya-launcher-windows.exe"

default:
  image: rust:1.90-bookworm
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cargo/registry/
      - .cargo/bin/
      - target/

# System libraries GPUI links on Linux (xcb + xkbcommon); also needed by
# `cargo check` because the xcb crates probe them via pkg-config.
.linux_deps: &linux_deps
  - apt-get update
  - >
    apt-get install -y --no-install-recommends
    pkg-config cmake clang curl
    libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libxau-dev libxdmcp-dev

# --- branch / MR feedback: type + borrow check (no linking) -----------------
check:
  stage: check
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script: *linux_deps
  script:
    - cargo check --locked

# --- Linux release binary ---------------------------------------------------
build:linux:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script: *linux_deps
  script:
    - cargo build --release --locked --target x86_64-unknown-linux-gnu
    - install -D target/x86_64-unknown-linux-gnu/release/harmoniya-launcher dist/harmoniya-launcher
    - tar -C dist -czf "$LINUX_ASSET" harmoniya-launcher
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$LINUX_ASSET" "$PKG_BASE/$LINUX_ASSET"'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/harmoniya-launcher "$PKG_BASE/$LINUX_BIN"'
  artifacts:
    paths: ["$LINUX_ASSET", "dist/harmoniya-launcher"]
    expire_in: 1 week

# --- Windows release binary (cross-compiled from Linux, no Windows runner) --
# clang-cl + lld-link + the xwin CRT/SDK build a real MSVC-target PE on the same
# Linux image as build:linux. gpui's fxc shader step is replaced by committed
# prebuilt DXBC (vendor/gpui/prebuilt/shaders_bytes.rs), and the app manifest +
# icon are embedded by build.rs (lld-link /MANIFEST:EMBED + llvm-rc). See
# vendor/gpui/HARMONIYA_PATCH.md and [[windows-cross-compile-feasibility]].
build:windows:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # cargo-xwin caches the downloaded CRT/SDK here; keep it in the project dir
    # so GitLab can cache it between runs (the download is large).
    XWIN_CACHE_DIR: "$CI_PROJECT_DIR/.xwin-cache"
  cache:
    key: "$CI_JOB_NAME_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/bin/
      - .xwin-cache/
      - target/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends clang lld llvm tar curl ca-certificates
    # build.rs uses llvm-rc for the app icon; Debian ships it versioned only.
    - export LLVM_RC="$(command -v llvm-rc llvm-rc-19 llvm-rc-18 llvm-rc-17 llvm-rc-16 llvm-rc-15 llvm-rc-14 2>/dev/null | head -n1)"
    - rustup target add x86_64-pc-windows-msvc
    - command -v cargo-xwin >/dev/null || cargo install cargo-xwin --locked
  script:
    - cargo xwin build --release --locked --target x86_64-pc-windows-msvc
    - install -D target/x86_64-pc-windows-msvc/release/harmoniya-launcher.exe dist/harmoniya-launcher.exe
    - tar -C dist -czf "$WINDOWS_ASSET" harmoniya-launcher.exe
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$WINDOWS_ASSET" "$PKG_BASE/$WINDOWS_ASSET"'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/harmoniya-launcher.exe "$PKG_BASE/$WINDOWS_BIN"'
  artifacts:
    paths: ["$WINDOWS_ASSET", "dist/harmoniya-launcher.exe"]
    expire_in: 1 week

# --- publish a GitLab Release linking the uploaded assets -------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:linux
    - build:windows
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG."
    assets:
      links:
        # `filepath` becomes the release link's direct_asset_path — what makes the
        # stable permalink resolve, e.g.
        #   /-/releases/permalink/latest/downloads/harmoniya-launcher-windows.exe
        # Without it that permalink 404s (the raw package URLs still work).
        - name: "$LINUX_ASSET"
          url: "$PKG_BASE/$LINUX_ASSET"
          filepath: "/$LINUX_ASSET"
        - name: "$WINDOWS_ASSET"
          url: "$PKG_BASE/$WINDOWS_ASSET"
          filepath: "/$WINDOWS_ASSET"
        - name: "$LINUX_BIN"
          url: "$PKG_BASE/$LINUX_BIN"
          filepath: "/$LINUX_BIN"
        - name: "$WINDOWS_BIN"
          url: "$PKG_BASE/$WINDOWS_BIN"
          filepath: "/$WINDOWS_BIN"
