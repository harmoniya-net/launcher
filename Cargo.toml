[package]
name = "harmoniya-launcher"
version = "0.5.11"
edition = "2021"
publish = false

[[bin]]
name = "harmoniya-launcher"
path = "src/main.rs"

[workspace]
members = ["crates/*"]
resolver = "2"

# Vendored gpui 0.2.2 with a single Windows-only fix: tolerate
# GetSystemFontCollection failing (corrupt font cache / bad font registry →
# ERROR_MORE_DATA) instead of panicking at startup. See vendor/gpui/HARMONIYA_PATCH.md.
# Drop this once the fix is upstream in a published gpui release.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

# Shared dependency specs for every workspace member (the app + crates/*). Pin
# version + features once here; members opt in with `{ workspace = true }`.
[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "fs", "sync"] }
# TLS: trust BOTH the bundled Mozilla roots (`webpki-roots`) and the OS
# certificate store (`native-roots`). webpki-roots alone is a frozen snapshot
# that ignores the platform store, so any machine behind an antivirus /
# corporate-proxy TLS interceptor — whose root lives only in the OS store —
# fails every HTTPS request with an opaque "error sending request for url".
# Loading both stores (see `http::client`) makes the launcher trust whatever
# the system browser trusts. `rustls-tls` is just an alias for webpki-only.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-webpki-roots",
  "rustls-tls-native-roots",
  "json",
  "gzip",
  "multipart",
  "stream",
] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
directories = "5"
base64 = "0.22"
url = "2"
indexmap = "2.14.0"
serde_urlencoded = "0.7"
percent-encoding = "2"
keyring = { version = "3", default-features = false, features = [
  "sync-secret-service",
  "vendored",
  "apple-native",
  "windows-native",
] }
tiny_http = "0.12"
open = "5"
sha2 = "0.10"
rand = "0.8"
opys-runtime = "0.1.25"
libc = "0.2"

[dependencies]
gpui = "0.2"

# Shared with the workspace crates (specs live in [workspace.dependencies]).
reqwest = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
url = { workspace = true }
open = { workspace = true }
image = { workspace = true }

# Workspace library crates.
harmoniya-api = { path = "crates/harmoniya-api" }
harmoniya-launch = { path = "crates/harmoniya-launch" }
mc-skin = { path = "crates/mc-skin" }

# App-only dependencies.
single-instance = "0.3"
rust-embed = "8"
pulldown-cmark = { version = "0.12", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
self_update = { version = "0.41", default-features = false, features = [
  "rustls",
  "compression-flate2",
  "archive-tar",
] }
http_client = { package = "gpui_http_client", version = "0.2" }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
emojis = "0.8.2"
# Discord Rich Presence over the local IPC socket/pipe to the desktop Discord
# client. Blocking API — driven from its own thread (see shell::discord), not
# the tokio runtime.
discord-rich-presence = "1"
unicode-segmentation = "1.13.2"
resvg = "0.47.0"

# Shipping / CI build (`cargo build --release`): optimize for binary size so the
# self-update downloads stay small. Slower to compile — use `--profile fast`
# locally (below) when iterating.
[profile.release]
opt-level = "z"     # smallest code ("s" is slightly bigger but keeps loop vectorization)
lto = "fat"         # whole-program inlining/dead-code elimination; smaller than "thin", slower build
codegen-units = 1   # better optimization & smaller output (no parallel-chunk overhead)
strip = true        # drop symbols + debuginfo
debug = false
panic = "abort"     # no unwinding: drops .gcc_except_table + most .eh_frame + landing pads.
                    # Safe here — gpui only uses catch_unwind in its test harness, not at runtime.

# Local "see the real experience, fast" build: release-grade runtime speed
# (opt-level 3) but quick to compile. Run with `cargo run --profile fast`.
[profile.fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 256
strip = false
incremental = true
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=/path/to/mold"]

# Tray: ksni (StatusNotifierItem over D-Bus) on Linux — no GTK loop, unlike
# tray-icon's Linux backend, so it doesn't fight GPUI's own Linux event loop.
# blocking + async-io (not the default tokio backend): ksni's tokio backend
# panics in zbus (`Handle::current`) when a menu item is clicked off-runtime.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.4", default-features = false, features = ["blocking", "async-io"] }

# Graceful SIGTERM to the game process on quit (tokio's Child only does SIGKILL).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# macOS/Windows use tray-icon, created on the main thread where GPUI pumps the
# native run loop, so its menu/click events are delivered.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24.0"

# True hide-to-tray on Windows: SW_HIDE via the raw HWND (App::hide is a no-op
# there, and minimize only parks it in the taskbar).
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# Embed the .exe icon (build.rs). cfg(windows) here is the build *host*, so these
# are pulled only when building on Windows (e.g. the CI Windows runner).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
ico = "0.3"
image = { workspace = true }
